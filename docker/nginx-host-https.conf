# Nginx do SERVIDOR (host) — HTTPS com Let's Encrypt
#
# O container SGA escuta em HTTP na porta do host (padrão 13080, só em 127.0.0.1).
# Este arquivo termina o SSL e encaminha para o Docker.
#
# Instalação:
#   sudo cp docker/nginx-host-https.conf /etc/nginx/sites-available/sga-wpa.conf
#   sudo ln -sf /etc/nginx/sites-available/sga-wpa.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d wpa.sgebr.com.br   # se ainda não tiver certificado
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ajuste SGA_UPSTREAM se usar outra porta no .env (SGA_HTTP_PORT).

upstream sga_docker {
    # Deve coincidir com SGA_HTTP_PORT no .env (padrão 13080)
    server 127.0.0.1:13080;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name wpa.sgebr.com.br;

    ssl_certificate /etc/letsencrypt/live/wpa.sgebr.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wpa.sgebr.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://sga_docker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Inclua wpa.sgebr.com.br no bloco de redirecionamento HTTP→HTTPS que você já usa,
