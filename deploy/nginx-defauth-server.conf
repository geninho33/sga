# Nginx do servidor 186.233.89.56 — WPA + Suporte + SGA Alimentação Escolar
#
# Instalação:
#   sudo cp /var/alimentacao-escolar/deploy/nginx-defauth-server.conf /etc/nginx/sites-available/defauth.conf
#   sudo ln -sf /etc/nginx/sites-available/defauth.conf /etc/nginx/sites-enabled/defauth.conf
#   sudo certbot certonly --nginx -d sga.sgebr.net.br   # se o cert ainda não existir
#   sudo nginx -t && sudo systemctl reload nginx
#
# SGA Docker: http://127.0.0.1:13080 (deploy/.env SGA_HTTP_PORT)

upstream sga_docker {
    server 127.0.0.1:13080;
    keepalive 16;
}

# --- WPA ---
server {
    listen 443 ssl;
    server_name wpa.sgebr.com.br;

    ssl_certificate /etc/letsencrypt/live/wpa.sgebr.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wpa.sgebr.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /wpapais/ {
        proxy_pass http://localhost:8081/wpapais/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api_pwa/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /oauth/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Suporte ---
server {
    listen 443 ssl;
    server_name suporte.sgebr.net.br;

    ssl_certificate /etc/letsencrypt/live/suporte.sgebr.net.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suporte.sgebr.net.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- SGA Alimentação Escolar ---
server {
    listen 443 ssl;
    server_name sga.sgebr.net.br;

    ssl_certificate /etc/letsencrypt/live/sga.sgebr.net.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sga.sgebr.net.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://sga_docker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# --- Redirecionamento HTTP → HTTPS ---
server {
    listen 80;
    server_name wpa.sgebr.com.br suporte.sgebr.net.br sga.sgebr.net.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        if ($host = suporte.sgebr.net.br) {
            return 301 https://$host$request_uri;
        }
        if ($host = wpa.sgebr.com.br) {
            return 301 https://$host$request_uri;
        }
        if ($host = sga.sgebr.net.br) {
            return 301 https://$host$request_uri;
        }
        return 404;
    }
}
