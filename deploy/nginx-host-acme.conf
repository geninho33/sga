# Fase 1: apenas HTTP — para emitir certificado Let's Encrypt (webroot)
# Uso: setup-https.sh instala isto antes do certbot, depois troca pelo nginx-host-https.conf

upstream sga_docker {
    server 127.0.0.1:13080;
    keepalive 16;
}

server {
    listen 80;
    server_name sga.sgebr.net.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass http://sga_docker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
