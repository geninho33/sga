services:
  sga:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sga-alimentacao-escolar:latest
    container_name: sga-alimentacao-escolar
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Apenas localhost — o Nginx do host (HTTPS) faz proxy para esta porta
      - "127.0.0.1:${SGA_HTTP_PORT:-13080}:80"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
